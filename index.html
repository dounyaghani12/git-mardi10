<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <h1>Formulaire d'inscription Freelance-Connect</h1>

 <from action="/traitement" method="post" enctype="multipart/form-data">
 <!-- Section 1 : Identité et Sécurité -->
 <fieldset>
 <legend>Section 1 : Identité et Sécurité</legend>
<input type="hidden" name="source" value="inscription"_web>  
<div> 
<label for="prenom">Prénom :</label>
<input type="text" id="prenom" name="prenom" required autofocus>
</div> 
<br> 
<div> 
    <label for="nom">Nom :</label>
    <input type="text" id="nom" name="nom" placeholder="DUPONT" required>
</div> 
<br>
<fieldset> 
    <label for="mot_de_passe">Mot de passe (8 caractères minimum) :</label> 
    <input type="password" id="mot_de_passe" name="mot_de_passe" minlength="8" required> 
    <br> 
    <div> 
    <label for="photo_profil">Photo de profil :</label>
    <input type="file" id="photo_profil" name="photo_profil" accept=".png, .jpg, .jpg, jpeg">
    </div> 
    </fieldset> 
</div> 
<fieldset> 
    <legend>Section 2 : Contact et Profil</legend>
    <div> 
        <label for="email_pro">Email professionnel :</label>
        <input type="email" id="email_pro" name="email_pro" required>
    </div>
    <br>
    <div> 
        <label for="telephone">Numéro de téléphone (10 chiffres) :</label>
        <input type="tel" id="telephone" name="telephone" pattern="[0-9]{10}" placeholder="0123456789" required> 
    </div>
    <br> 
    <div> 
        <label for="site_web">Couleur du thème :</label>
        <input type="url" id="site_web" name="site_web" placeholder="https://www.monsite.com">
</fieldset> 

 <fieldset> 
    <legend>Section 3 : Informations professionnelles</legend>
    <div> 
        <label for="experience">Années d'experience</label>
        <input type="number" id="experience" name="experience" min="0" max="50" required>
    </div>
    <br>
    <div> 
        <label for="seniorite">Niveau de séniorité (1 à 5) :</label>
        <input type="range" id="seniorite" name="seniorite" min="1" max="5" required>
    </div>
    <br> 
    <div> 
        <label>Langages maîtrisés :</label><br>
        <input type="checkbox" id="lang1" name="langages[]" value="HTML" checked>
        <label for="lang1">HTML</label><br>
        <input type="checkbox" id="lang2" name="langages[]" value="CSS">
        <label for="lang2">CSS</label><br> 
        <input type="checkbox" id="lang3" name="langages[]" value="JavaScript">
        <label for="lang3">JavaScript</label><br> 
        <input type="checkbox" id="lang4" name="langages[]" value="Python">
        <label for="lang4">Python</label><br>
    </div>
    <br>
    <div> 
        <label>Statut juridique :</label><br>
        <input type="radio" id="auto_entrepreneur" name="statut_juridique" value="auto_entrepreneur" required>
        <label for="auto_entrepreneur">Auto-entrepreneur</label> 

        <input type="radio" id="statut2" name="statut_juridique" value="sasu">
        <label for="statut2">SASU</label>

        <input type="radio" id="statut3" name="statut_juridique" value="eurl"> 
        <label for="statut3">EURL</label> 
    </div> 
    <br> 
    <label for="region">Région d'intervention :</label>
    <select id="region" name="region"> 
        <option value="">--Sélectionnez une région</option>
        <optgroup label="Group Nord"> 
            <option value="ile-de-france">Île-de-France</option>
            <option value="hauts-de-france">Hauts-de-France</option>
        </optgroup> 
        <optgroup label="Group Sud"> 
            <option value="paca">Province-Alpes-Côte</option> 
            <option value="occitanie">Occitanie</option>
        </optgroup> 
    </select> 
 </div> 
 </fieldset> 
 <!-- Section 4 : Disponibilités et Finalisation --> 
  <fieldset> 
    <legend>Section 4 : Disponibilités et Finalisation</legend>

    <div> 
        <label for="dispo">Date de Disponibilités :</label>
        <input type="date" id="dispo" name="dispo" required> 
    </div>
    <br>
    <div>
        <label for="audit">Dernier audit technique :</label>
        <input type="text" id="audit" name="audit" value="Non réalisé" readonly> 
    </div>
    <br>
    <div>
        <label for="motivation">Motivation :</label><br>
        <textarea id="motivation" name="motivation" rows="8" maxlength="500" placeholder="Expliquez votre motivation pour rejoindre Freelance-Connect"></textarea>
    </div> 
    <br>
    <div> 
        <input type="checkbox" id="cgu" name="cgu" required>
        <label for="cgu ">J'accepte les conditions générales d'utilisation (CGU)</label>
        </div>
        
        <br>
        <div> 
            <button type="submit">Envoyer</button>
            <button type="reset">Effacer</button>
        </div>
 </fieldset>
 </form>
</body>
</html>
